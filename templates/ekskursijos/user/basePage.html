{% load static %}
<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Ekskursijos{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'ekskursijos/css/main.css' %}">
</head>
<body>
<nav class="navbar">
    <a href="{% url 'excursionListPage' %}" class="navbar__brand">Ekskursijos</a>
    {% if user.is_authenticated %}
        <span class="navbar__user-info">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="navbar__logout-btn">Atsijungti</button>
        </form>
    {% endif %}
</nav>
<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert--{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
