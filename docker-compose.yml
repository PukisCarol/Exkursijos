services:
  web:
    build: .
    # Port not exposed externally; nginx proxies to internal port 8000
    expose:
      - "8000"
    volumes:
      - static_volume:/static
      - media_volume:/media
    env_file:
      - .env
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - web
    restart: unless-stopped

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ekskursijos}
      POSTGRES_DB: ${DB_NAME:-ekskursijos_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  postgres_data:
